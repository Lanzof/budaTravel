services:
  db:
    image: postgres:16-alpine
    container_name: budatravel-db
    environment:
      POSTGRES_USER: route_user
      POSTGRES_PASSWORD: route_pass
      POSTGRES_DB: route_finder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U route_user -d route_finder_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: ingestor/build/libs/ingestor-0.0.1-SNAPSHOT.jar
    container_name: budatravel-ingestor
    environment:
      DB_URL: jdbc:postgresql://db:5432/route_finder_db
      DB_USER: route_user
      DB_PASSWORD: route_pass
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: api/build/libs/api-0.0.1-SNAPSHOT.jar
    container_name: budatravel-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/route_finder_db
      DB_USER: route_user
      DB_PASSWORD: route_pass
    ports:
      - "8080:8080"
    depends_on:
      ingestor:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: budatravel-web-ui
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
